<svg viewBox="0 0 380 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crabCarapace" x1="60" y1="60" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#144238"/>
      <stop offset="0.4" stop-color="#246356"/>
      <stop offset="0.8" stop-color="#4C9C8C"/>
      <stop offset="1" stop-color="#A2E2D6"/>
    </linearGradient>
    <linearGradient id="clawGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E07A4A"/>
      <stop offset="0.6" stop-color="#9C441E"/>
      <stop offset="1" stop-color="#5C240E"/>
    </linearGradient>
    <filter id="crabGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#246356" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Walking Legs Left -->
  <path d="M120 160 C80 170 50 200 40 230" stroke="#246356" stroke-width="8" stroke-linecap="round"/>
  <path d="M130 180 C95 200 70 230 65 255" stroke="#246356" stroke-width="7" stroke-linecap="round"/>
  <path d="M150 195 C120 220 100 250 95 270" stroke="#246356" stroke-width="7" stroke-linecap="round"/>
  <!-- Swimming Paddle Leg Left -->
  <path d="M170 200 C150 230 140 255 130 270" stroke="#246356" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="128" cy="270" rx="14" ry="7" fill="#4C9C8C" transform="rotate(-30 128 270)"/>

  <!-- Walking Legs Right -->
  <path d="M260 160 C300 170 330 200 340 230" stroke="#246356" stroke-width="8" stroke-linecap="round"/>
  <path d="M250 180 C285 200 310 230 315 255" stroke="#246356" stroke-width="7" stroke-linecap="round"/>
  <path d="M230 195 C260 220 280 250 285 270" stroke="#246356" stroke-width="7" stroke-linecap="round"/>
  <!-- Swimming Paddle Leg Right -->
  <path d="M210 200 C230 230 240 255 250 270" stroke="#246356" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="252" cy="270" rx="14" ry="7" fill="#4C9C8C" transform="rotate(30 252 270)"/>

  <!-- Left Great Chela / Claw -->
  <path d="M130 130 C90 100 65 80 50 95 C40 105 45 130 75 135 Z" fill="url(#clawGrad)" filter="url(#crabGlow)"/>
  <path d="M50 95 C30 70 40 40 70 50 C85 58 75 80 55 90 Z" fill="url(#clawGrad)"/>
  <path d="M52 92 C32 95 20 80 32 65 C42 68 48 80 52 92 Z" fill="#E07A4A"/>

  <!-- Right Great Chela / Claw -->
  <path d="M250 130 C290 100 315 80 330 95 C340 105 335 130 305 135 Z" fill="url(#clawGrad)" filter="url(#crabGlow)"/>
  <path d="M330 95 C350 70 340 40 310 50 C295 58 305 80 325 90 Z" fill="url(#clawGrad)"/>
  <path d="M328 92 C348 95 360 80 348 65 C338 68 332 80 328 92 Z" fill="#E07A4A"/>

  <!-- Crab Shell / Carapace -->
  <path d="M100 160 C80 130 105 110 135 110 L245 110 C275 110 300 130 280 160 C260 195 230 215 190 215 C150 215 120 195 100 160 Z" fill="url(#crabCarapace)" filter="url(#crabGlow)"/>

  <!-- Carapace Serrations / H-groove marking -->
  <path d="M175 145 C185 155 195 155 205 145" stroke="#144238" stroke-width="3" stroke-linecap="round"/>
  <path d="M180 165 C188 172 192 172 200 165" stroke="#144238" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stalk Eyes -->
  <circle cx="170" cy="108" r="5" fill="#0C2620"/>
  <circle cx="169" cy="106" r="2" fill="#FFFFFF"/>
  <circle cx="210" cy="108" r="5" fill="#0C2620"/>
  <circle cx="209" cy="106" r="2" fill="#FFFFFF"/>
</svg>
