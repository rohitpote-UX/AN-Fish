<svg viewBox="0 0 400 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jitadaBody" x1="50" y1="30" x2="350" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B5658"/>
      <stop offset="0.3" stop-color="#7C9294"/>
      <stop offset="0.65" stop-color="#DCE4E5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="jitadaFin" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8FA2A4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3D4B4D" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="jitadaGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0A9AD9" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Tail fin (rounded-truncate) -->
  <path d="M70 105 L22 62 C32 90 32 120 22 148 L70 105 Z" fill="url(#jitadaFin)" filter="url(#jitadaGlow)"/>
  <!-- Spiny First Dorsal & Soft Second Dorsal -->
  <path d="M185 45 L215 28 L235 55 Z" fill="url(#jitadaFin)"/>
  <path d="M125 58 C155 42 180 48 185 62 C160 65 140 65 125 58 Z" fill="url(#jitadaFin)"/>
  <!-- Anal Fin -->
  <path d="M120 152 C145 172 165 162 170 142 Z" fill="url(#jitadaFin)"/>
  <!-- Seabass Body with concave head and humped back -->
  <path d="M68 105 C95 58 190 40 265 65 C295 75 320 90 348 102 C325 115 295 125 260 145 C185 165 105 150 68 105 Z" fill="url(#jitadaBody)" filter="url(#jitadaGlow)"/>
  <!-- Pectoral Fin -->
  <path d="M245 110 C280 108 300 126 288 136 C270 136 255 125 245 110 Z" fill="url(#jitadaFin)"/>
  <!-- Gill flap with spine -->
  <path d="M280 82 C295 98 290 120 275 132" stroke="#2D3B3D" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <!-- Distinctive large Seabass Eye -->
  <circle cx="318" cy="95" r="7" fill="#152123"/>
  <circle cx="316" cy="93" r="3" fill="#DCE4E5"/>
  <circle cx="315" cy="92" r="1.5" fill="#FFFFFF"/>
</svg>
