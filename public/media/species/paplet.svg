<svg viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="papletGrad" x1="50" y1="30" x2="350" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#E9F7FF"/>
      <stop offset="0.7" stop-color="#A5DBF5"/>
      <stop offset="1" stop-color="#4B9DC9"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A5DBF5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A9AD9" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A9AD9" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Tail fin -->
  <path d="M70 120 L20 60 C35 90 35 150 20 180 L70 120 Z" fill="url(#finGrad)" filter="url(#subtleGlow)"/>
  <!-- Dorsal & Anal long fins -->
  <path d="M140 50 C200 15 250 20 280 40 C240 60 210 65 170 65 Z" fill="url(#finGrad)"/>
  <path d="M150 190 C210 225 260 220 290 200 C250 180 220 175 180 175 Z" fill="url(#finGrad)"/>
  <!-- Pomfret Disc Body -->
  <path d="M60 120 C100 40 250 30 330 110 C350 120 350 125 330 135 C250 210 100 200 60 120 Z" fill="url(#papletGrad)" filter="url(#subtleGlow)"/>
  <!-- Pectoral fin -->
  <path d="M220 125 C260 115 290 140 280 155 C250 160 230 145 220 125 Z" fill="url(#finGrad)"/>
  <!-- Operculum gill line -->
  <path d="M280 85 C295 105 295 135 280 155" stroke="#063A63" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Bright Eye -->
  <circle cx="310" cy="112" r="7" fill="#05080C"/>
  <circle cx="309" cy="110" r="3" fill="#FFFFFF"/>
  <circle cx="310" cy="112" r="8" stroke="#E9F7FF" stroke-width="1.5" opacity="0.8"/>
</svg>
